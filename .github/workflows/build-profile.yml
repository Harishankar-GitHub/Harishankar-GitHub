name: Build profile images

# Rebuilds assets/ and the generated README blocks whenever scripts/profile.toml
# (or the generator) changes, and commits the result to the same branch.
on:
  push:
    branches: ["**"]
    paths:
      - "scripts/**"
      - ".github/workflows/build-profile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build images
        run: python scripts/build_assets.py

      - name: Commit rebuilt images
        run: |
          if [ -z "$(git status --porcelain -- assets README.md)" ]; then
            echo "Images and README are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git commit -m "Rebuild profile images from scripts/profile.toml"
          git push origin "HEAD:${GITHUB_REF_NAME}"
